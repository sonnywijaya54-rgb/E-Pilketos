<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Pemilihan Ketua OSIS</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media print {
            body { background-color: white; }
            .no-print { display: none !important; }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-osis-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, db, auth;
        let currentUser = null; 
        let adminRole = null; // 'operator' or 'superadmin'
        
        const basePath = `artifacts/${appId}`;
        const publicDataPath = `${basePath}/public/data`;

        let candidatesData = [];
        let votersData = [];
        let auditLogsData = [];
        let configData = { 
            resultsPublished: false,
            appTitle: 'E-Pilketos',
            appSubtitle: 'Sistem Pemilihan Ketua OSIS Digital',
            logoUrl: '',
            heroImage: '',
            allowBlankVote: true,
            startTime: '',
            endTime: ''
        };

        async function initApp() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                await initializeDefaultData();
                listenToConfig();
                listenToCandidates();
                listenToVoters();
                listenToAuditLogs();

                renderView('home');
                hideLoading();

            } catch (error) {
                console.error("Initialization error:", error);
                showToast("Gagal terhubung ke database. Muat ulang halaman.", "error");
            }
        }

        async function logActivity(action, details) {
            try {
                const logsRef = collection(db, publicDataPath, 'audit_logs');
                await addDoc(logsRef, {
                    action: action,
                    details: details,
                    timestamp: new Date().toISOString()
                });
            } catch (e) {
                console.error("Failed to log activity:", e);
            }
        }

        async function initializeDefaultData() {
            const configRef = doc(db, publicDataPath, 'config', 'settings');
            const configSnap = await getDoc(configRef);
            
            if (!configSnap.exists()) {
                await setDoc(configRef, { 
                    resultsPublished: false,
                    appTitle: 'E-Pilketos',
                    appSubtitle: 'Sistem Pemilihan Ketua OSIS Digital',
                    logoUrl: '',
                    heroImage: '',
                    allowBlankVote: true,
                    startTime: '',
                    endTime: ''
                });
            } else {
                configData = configSnap.data();
                applyWebsiteConfig();
            }

            const candidatesRef = collection(db, publicDataPath, 'candidates');
            const candidatesSnap = await getDocs(candidatesRef);
            
            if (candidatesSnap.empty) {
                await setDoc(doc(db, publicDataPath, 'candidates', '1'), {
                    id: '1',
                    name: 'Paslon 1 (Andi & Siska)',
                    vision: 'Mewujudkan OSIS yang aktif, kreatif, dan berakhlak mulia.',
                    mission: '1. Mengadakan kegiatan seni dan olahraga rutin.\n2. Meningkatkan transparansi program kerja.',
                    proker: '1. Festival Budaya Tahunan\n2. Kotak Aspirasi Digital Siswa',
                    votes: 0
                });
                await setDoc(doc(db, publicDataPath, 'candidates', '2'), {
                    id: '2',
                    name: 'Paslon 2 (Budi & Rina)',
                    vision: 'Menjadikan OSIS sebagai wadah aspirasi siswa yang inovatif dan berprestasi.',
                    mission: '1. Memperkuat kedisiplinan dan solidaritas antar angkatan.\n2. Mengoptimalkan klub ekstrakurikuler.',
                    proker: '1. Liga E-Sport Antar Kelas\n2. Workshop Kewirausahaan Remaja',
                    votes: 0
                });
            }
        }

        function listenToConfig() {
            const configRef = doc(db, publicDataPath, 'config', 'settings');
            onSnapshot(configRef, (docSnap) => {
                if (docSnap.exists()) {
                    configData = docSnap.data();
                    applyWebsiteConfig();
                    const currentView = document.getElementById('current-view-name').value;
                    if (currentView === 'home' || currentView === 'student-results') {
                        renderView(currentView, false); 
                    } else if (currentView === 'admin-dashboard') {
                        updateAdminPublishStatus();
                    }
                }
            }, (error) => console.error("Config listen error:", error));
        }

        window.updateAdminPublishStatus = function() {
            const toggle = document.getElementById('publish-toggle');
            if (toggle) toggle.checked = !!configData.resultsPublished;
            const blankToggle = document.getElementById('blank-toggle');
            if (blankToggle) blankToggle.checked = configData.allowBlankVote !== false;
        };

        function applyWebsiteConfig() {
            const titleEl = document.getElementById('page-title');
            if (titleEl && configData.appTitle) titleEl.innerText = configData.appTitle;
            
            const brandText = document.getElementById('navbar-brand-text');
            if (brandText && configData.appTitle) brandText.innerText = configData.appTitle;

            const logoContainer = document.getElementById('navbar-logo-container');
            if (logoContainer) {
                if (configData.logoUrl) {
                    logoContainer.innerHTML = `<img src="${configData.logoUrl}" alt="Logo" class="w-full h-full object-cover rounded" onerror="this.onerror=null;this.parentNode.innerHTML='E';">`;
                    logoContainer.classList.remove('bg-blue-600', 'text-white');
                } else {
                    logoContainer.innerHTML = 'E';
                    logoContainer.classList.add('bg-blue-600', 'text-white');
                }
            }
        }

        function listenToCandidates() {
            const candidatesRef = collection(db, publicDataPath, 'candidates');
            onSnapshot(candidatesRef, (snapshot) => {
                candidatesData = [];
                snapshot.forEach((doc) => {
                    candidatesData.push({ docId: doc.id, ...doc.data() });
                });
                candidatesData.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                
                const currentView = document.getElementById('current-view-name').value;
                if (currentView === 'voting') renderVotingCards();
                if (currentView === 'admin-dashboard') {
                    renderAdminLiveResults();
                    renderAdminCandidatesForm();
                }
                if (currentView === 'student-results') renderStudentResultsData();
            }, (error) => console.error("Candidates listen error:", error));
        }

        function listenToVoters() {
            const votersRef = collection(db, publicDataPath, 'voters');
            onSnapshot(votersRef, (snapshot) => {
                votersData = [];
                snapshot.forEach((doc) => {
                    votersData.push({ nisn: doc.id, ...doc.data() });
                });
                const currentView = document.getElementById('current-view-name').value;
                if (currentView === 'admin-dashboard') {
                    renderAdminVotersTable();
                }
            }, (error) => console.error("Voters listen error:", error));
        }

        function listenToAuditLogs() {
            const logsRef = collection(db, publicDataPath, 'audit_logs');
            onSnapshot(logsRef, (snapshot) => {
                auditLogsData = [];
                snapshot.forEach((doc) => {
                    auditLogsData.push({ id: doc.id, ...doc.data() });
                });
                auditLogsData.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                const currentView = document.getElementById('current-view-name').value;
                if (currentView === 'admin-dashboard') {
                    renderAdminAuditLogsTable();
                }
            }, (error) => console.error("Audit logs error:", error));
        }

        window.switchView = (viewName) => {
            renderView(viewName);
        };

        function renderView(viewName, smooth = true) {
            document.getElementById('current-view-name').value = viewName;
            const container = document.getElementById('app-content');
            
            if (smooth) container.innerHTML = '<div class="flex justify-center py-20"><div class="loader"></div></div>';

            setTimeout(() => {
                switch (viewName) {
                    case 'home':
                        container.innerHTML = getHomeHTML();
                        initCountdown();
                        break;
                    case 'admin-login':
                        container.innerHTML = getAdminLoginHTML();
                        break;
                    case 'admin-dashboard':
                        if (!adminRole) { renderView('home'); return; }
                        container.innerHTML = getAdminDashboardHTML();
                        renderAdminVotersTable();
                        renderAdminCandidatesForm();
                        renderAdminAppearanceForm();
                        renderAdminAuditLogsTable();
                        break;
                    case 'voting':
                        if (!currentUser || currentUser.hasVoted) { renderView('home'); return; }
                        container.innerHTML = getVotingHTML();
                        renderVotingCards();
                        break;
                    case 'student-results':
                        container.innerHTML = getStudentResultsHTML();
                        if (configData.resultsPublished) {
                            renderStudentResultsData();
                        }
                        break;
                    case 'voted-success':
                        container.innerHTML = getVotedSuccessHTML();
                        break;
                    default:
                        container.innerHTML = getHomeHTML();
                }
            }, smooth ? 300 : 0);
        }

        function checkElectionActiveStatus() {
            if (!configData.startTime && !configData.endTime) return { active: true, message: '' };
            const now = new Date().getTime();
            if (configData.startTime) {
                const start = new Date(configData.startTime).getTime();
                if (now < start) return { active: false, message: 'Pemilihan belum dimulai.' };
            }
            if (configData.endTime) {
                const end = new Date(configData.endTime).getTime();
                if (now > end) return { active: false, message: 'Pemilihan sudah ditutup.' };
            }
            return { active: true, message: '' };
        }

        function initCountdown() {
            const timerEl = document.getElementById('countdown-timer');
            if (!timerEl) return;
            if (!configData.endTime) {
                timerEl.innerHTML = '<span class="text-slate-500 font-medium">Jadwal fleksibel (Aktif)</span>';
                return;
            }

            const targetTime = new Date(configData.endTime).getTime();
            const update = () => {
                const now = new Date().getTime();
                const distance = targetTime - now;
                if (distance < 0) {
                    timerEl.innerHTML = '<span class="text-red-600 font-bold">Pemilihan Telah Ditutup</span>';
                    return;
                }
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                timerEl.innerHTML = `<span class="bg-blue-50 text-blue-700 px-3 py-1 rounded font-mono font-bold">${hours}j ${minutes}m ${seconds}d</span> menuju penutupan`;
            };
            update();
            setInterval(update, 1000);
        }

        function getHomeHTML() {
            return `
                <div class="max-w-4xl mx-auto fade-in">
                    <div class="text-center mb-8">
                        <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-600 text-white rounded-full mb-4 shadow-lg overflow-hidden">
                            ${configData.logoUrl ? `<img src="${configData.logoUrl}" class="w-full h-full object-cover" onerror="this.remove()">` : '<i class="fa-solid fa-check-to-slot text-4xl"></i>'}
                        </div>
                        <h1 class="text-3xl font-bold text-slate-800 mb-2">${escapeHTML(configData.appTitle || 'E-Pilketos')}</h1>
                        <p class="text-slate-500 mb-4">${escapeHTML(configData.appSubtitle || 'Sistem Pemilihan Ketua OSIS Digital')}</p>
                        <div id="countdown-timer" class="text-sm text-slate-600"></div>
                    </div>

                    ${configData.heroImage ? `
                        <div class="mb-10 rounded-2xl overflow-hidden shadow-md max-h-72 border border-slate-200">
                            <img src="${configData.heroImage}" alt="Banner" class="w-full h-full object-cover" onerror="this.parentElement.style.display='none'">
                        </div>
                    ` : ''}

                    <div class="grid md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center hover:shadow-md transition">
                            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4 text-xl">
                                <i class="fa-solid fa-key"></i>
                            </div>
                            <h2 class="text-xl font-semibold mb-2">1. Dapatkan Token</h2>
                            <p class="text-sm text-slate-500 mb-6 flex-grow">Gunakan Nama dan NISN kamu untuk mendapatkan token pemilihan sekali pakai.</p>
                            <button onclick="openModal('token-modal')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-medium py-2 px-4 rounded-lg transition">
                                Cek Token Saya
                            </button>
                        </div>

                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center hover:shadow-md transition relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>
                            <div class="w-12 h-12 bg-blue-500 text-white rounded-full flex items-center justify-center mb-4 text-xl shadow-md">
                                <i class="fa-solid fa-person-booth"></i>
                            </div>
                            <h2 class="text-xl font-semibold mb-2">2. Mulai Memilih</h2>
                            <p class="text-sm text-slate-500 mb-6 flex-grow">Masukkan token rahasia kamu untuk masuk ke bilik suara virtual.</p>
                            <button onclick="handleLoginClick()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition shadow-sm hover:shadow">
                                Login Token
                            </button>
                        </div>

                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center hover:shadow-md transition">
                            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-4 text-xl">
                                <i class="fa-solid fa-chart-pie"></i>
                            </div>
                            <h2 class="text-xl font-semibold mb-2">3. Lihat Hasil</h2>
                            <p class="text-sm text-slate-500 mb-6 flex-grow">Cek perolehan suara setelah admin mempublikasikan hasil pemilihan.</p>
                            ${configData.resultsPublished 
                                ? `<button onclick="openModal('results-login-modal')" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-2 px-4 rounded-lg transition shadow-sm">Lihat Hasil</button>`
                                : `<button disabled class="w-full bg-slate-100 text-slate-400 cursor-not-allowed font-medium py-2 px-4 rounded-lg">Belum Dipublikasi</button>`
                            }
                        </div>
                    </div>
                </div>

                ${getModalsHTML()}
            `;
        }

        window.handleLoginClick = () => {
            const status = checkElectionActiveStatus();
            if (!status.active) {
                showToast(status.message, 'warning');
                return;
            }
            openModal('login-modal');
        };

        function getModalsHTML() {
            return `
                <!-- Token Modal -->
                <div id="token-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50">
                    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl transform scale-95 transition-transform" id="token-modal-content">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-xl font-semibold">Cek Token Pemilihan</h3>
                            <button onclick="closeModal('token-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                                <input type="text" id="check-name" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Masukkan nama...">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">NISN</label>
                                <input type="text" id="check-nisn" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Masukkan NISN...">
                            </div>
                            <button onclick="handleCheckToken()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition flex justify-center items-center">
                                <span id="btn-text-check">Dapatkan Token</span>
                                <div id="btn-load-check" class="loader hidden ml-2 w-4 h-4 border-2 border-white border-top-transparent"></div>
                            </button>
                            
                            <div id="token-result-area" class="hidden mt-4 p-4 bg-slate-50 border border-slate-200 rounded-lg text-center">
                                <p class="text-sm text-slate-500 mb-1">Token Rahasia Kamu:</p>
                                <div class="flex justify-center items-center gap-3 mb-2">
                                    <p id="the-token" class="text-2xl font-mono font-bold text-blue-600 tracking-wider">---</p>
                                    <button onclick="copyToken()" class="text-slate-400 hover:text-blue-600 transition p-1 bg-white border border-slate-200 rounded shadow-sm hover:shadow" title="Salin Token">
                                        <i class="fa-solid fa-copy"></i>
                                    </button>
                                </div>
                                <p class="text-xs text-red-500 font-medium"><i class="fa-solid fa-triangle-exclamation"></i> Catat dan JANGAN berikan ke siapapun!</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Login Modal -->
                <div id="login-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50">
                    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl transform scale-95 transition-transform" id="login-modal-content">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-xl font-semibold">Login Bilik Suara</h3>
                            <button onclick="closeModal('login-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Token Pemilihan</label>
                                <div class="flex gap-2">
                                    <input type="text" id="login-token" class="flex-1 px-4 py-2 text-center text-xl tracking-widest font-mono border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none uppercase" placeholder="XXXXXX">
                                    <button onclick="pasteToken()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg transition text-sm flex items-center gap-1 shadow-sm" title="Tempel Token dari Clipboard">
                                        <i class="fa-solid fa-paste"></i> Tempel
                                    </button>
                                </div>
                            </div>
                            <button onclick="handleTokenLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition flex justify-center items-center">
                                <span id="btn-text-login">Masuk ke Bilik Suara</span>
                                <div id="btn-load-login" class="loader hidden ml-2 w-4 h-4 border-2 border-white border-top-transparent"></div>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Results Login Modal -->
                <div id="results-login-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50">
                    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl transform scale-95 transition-transform" id="results-modal-content">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-xl font-semibold">Akses Hasil Pemilihan</h3>
                            <button onclick="closeModal('results-login-modal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <p class="text-sm text-slate-500 mb-4">Hanya siswa yang telah memberikan hak suaranya yang dapat melihat hasil.</p>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                                <input type="text" id="res-name" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">NISN</label>
                                <input type="text" id="res-nisn" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none">
                            </div>
                            <button onclick="handleResultsLogin()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-2.5 rounded-lg transition flex justify-center items-center">
                                <span id="btn-text-res">Lihat Hasil</span>
                                <div id="btn-load-res" class="loader hidden ml-2 w-4 h-4 border-2 border-white border-top-transparent"></div>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.openModal = (id) => {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.remove('hidden');
            setTimeout(() => {
                const content = document.getElementById(id + '-content');
                if (content) {
                    content.classList.remove('scale-95');
                    content.classList.add('scale-100');
                }
            }, 10);
        };
        
        window.closeModal = (id) => {
            const content = document.getElementById(id + '-content');
            if (content) {
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
            }
            setTimeout(() => {
                const modal = document.getElementById(id);
                if (modal) modal.classList.add('hidden');
            }, 150);
        };

        window.copyToken = () => {
            const tokenEl = document.getElementById('the-token');
            if (!tokenEl) return;
            const token = tokenEl.innerText;
            if (token && token !== '---') {
                const hiddenInput = document.createElement('input');
                hiddenInput.value = token;
                document.body.appendChild(hiddenInput);
                hiddenInput.select();
                hiddenInput.setSelectionRange(0, 99999);
                try {
                    document.execCommand('copy');
                    showToast('Token berhasil disalin!', 'success');
                } catch (err) {
                    showToast('Gagal menyalin token', 'error');
                }
                document.body.removeChild(hiddenInput);
            }
        };

        window.pasteToken = async () => {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    const loginTokenInput = document.getElementById('login-token');
                    if (loginTokenInput) {
                        loginTokenInput.value = text.trim();
                        showToast('Token berhasil ditempel!', 'success');
                    }
                } else {
                    showToast('Gunakan shortcut Ctrl+V pada keyboard Anda.', 'info');

        window.handleCheckToken = async () => {
            const nameEl = document.getElementById('check-name');
            const nisnEl = document.getElementById('check-nisn');
            if (!nameEl || !nisnEl) return;
            
            const name = nameEl.value.trim();
            const nisn = nisnEl.value.trim();
            if (!name || !nisn) return showToast('Nama dan NISN harus diisi', 'warning');
            
            setBtnLoading('check', true);
            try {
                const voterRef = doc(db, publicDataPath, 'voters', nisn);
                const voterSnap = await getDoc(voterRef);
                
                if (voterSnap.exists()) {
                    const data = voterSnap.data();
                    if (data.name.toLowerCase() === name.toLowerCase()) {
                        const resultArea = document.getElementById('token-result-area');
                        const theToken = document.getElementById('the-token');
                        if (resultArea) resultArea.classList.remove('hidden');
                        if (theToken) theToken.innerText = data.token;
                        if(data.hasVoted) showToast('Perhatian: Anda sudah menggunakan hak suara.', 'info');
                        logActivity('Cek Token', `Siswa ${name} (${nisn}) meminta token pemilihan.`);
                    } else {
                        showToast('Data tidak cocok. Periksa kembali ejaan Nama.', 'error');
                    }
                } else {
                    showToast('NISN tidak terdaftar.', 'error');
                }
            } catch (error) {
                showToast('Terjadi kesalahan', 'error');
            }
            setBtnLoading('check', false);
        };

        window.handleTokenLogin = async () => {
            const status = checkElectionActiveStatus();
            if (!status.active) {
                showToast(status.message, 'warning');
                return;
            }

            const tokenInput = document.getElementById('login-token');
            if (!tokenInput) return;
            const token = tokenInput.value.trim().toUpperCase();
            if (!token) return showToast('Masukkan token', 'warning');
            
            setBtnLoading('login', true);
            try {
                const votersRef = collection(db, publicDataPath, 'voters');
                const snapshot = await getDocs(votersRef);
                
                let foundVoter = null;
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.token === token) foundVoter = { nisn: docSnap.id, ...data };
                });

                if (foundVoter) {
                    if (foundVoter.hasVoted) {
                        showToast('Token ini sudah digunakan untuk memilih.', 'error');
                    } else {
                        currentUser = foundVoter;
                        closeModal('login-modal');
                        switchView('voting');
                    }
                } else {
                    showToast('Token tidak valid.', 'error');
                }
            } catch (error) {
                showToast('Terjadi kesalahan', 'error');
            }
            setBtnLoading('login', false);
        };

        window.executeVote = async (candidateDocId) => {
            if (!currentUser || currentUser.hasVoted) return;
            const btn = document.getElementById('btn-exec-vote');
            if(btn) {
                btn.innerHTML = '<div class="loader w-4 h-4 border-2 border-white border-top-transparent"></div>';
                btn.disabled = true;
            }

            try {
                if (candidateDocId !== 'BLANK') {
                    const candidateRef = doc(db, publicDataPath, 'candidates', candidateDocId);
                    const candSnap = await getDoc(candidateRef);
                    const currentVotes = candSnap.data().votes || 0;
                    await updateDoc(candidateRef, { votes: currentVotes + 1 });
                } else {
                    const blankRef = doc(db, publicDataPath, 'config', 'stats');
                    const blankSnap = await getDoc(blankRef);
                    const currentBlank = blankSnap.exists() ? (blankSnap.data().blankVotes || 0) : 0;
                    await setDoc(blankRef, { blankVotes: currentBlank + 1 }, { merge: true });
                }

                const voterRef = doc(db, publicDataPath, 'voters', currentUser.nisn);
                await updateDoc(voterRef, { hasVoted: true, votedAt: new Date().toISOString() });

                logActivity('Voting', `Siswa ${currentUser.name} (${currentUser.nisn}) telah menggunakan hak suara.`);
                currentUser.hasVoted = true;
                
                const modal = document.getElementById('confirm-modal');
                if(modal) modal.remove();
                switchView('voted-success');

                const modal = document.getElementById('confirm-modal');
                if(modal) modal.remove();
                showToast("Terjadi kesalahan saat menyimpan suara.", "error");
            }
        };

        window.handleAddVoter = async () => {
            const nameEl = document.getElementById('add-voter-name');
            const nisnEl = document.getElementById('add-voter-nisn');
            if (!nameEl || !nisnEl) return;

            const name = nameEl.value.trim();
            const nisn = nisnEl.value.trim();
            if (!name || !nisn) return showToast('Nama dan NISN harus diisi', 'warning');

            try {
                const voterRef = doc(db, publicDataPath, 'voters', nisn);
                const voterSnap = await getDoc(voterRef);
                if (voterSnap.exists()) {
                    return showToast('NISN sudah terdaftar di sistem!', 'error');
                }

                const randomToken = Math.random().toString(36).substring(2, 8).toUpperCase();
                await setDoc(voterRef, {
                    name: name,
                    token: randomToken,
                    hasVoted: false
                });

                logActivity('Tambah Pemilih', `Admin menambahkan pemilih ${name} (${nisn})`);
                nameEl.value = '';
                nisnEl.value = '';
                showToast('Pemilih berhasil ditambahkan!', 'success');
            } catch (e) {
                showToast('Gagal menambahkan pemilih', 'error');
            }
        };

        window.handleImportCSV = async () => {
            const fileInput = document.getElementById('csv-file-input');
            if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
                return showToast('Pilih file CSV terlebih dahulu', 'warning');
            }

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = async function(e) {
                const text = e.target.result;
                const lines = text.split(/\r\n|\n/);
                let count = 0;

                for (let line of lines) {
                    if (!line.trim()) continue;
                    const parts = line.split(',');
                    if (parts.length >= 2) {
                        const name = parts[0].trim();
                        const nisn = parts[1].trim();
                        if (name && nisn) {
                            try {
                                const voterRef = doc(db, publicDataPath, 'voters', nisn);
                                const voterSnap = await getDoc(voterRef);
                                if (!voterSnap.exists()) {
                                    const randomToken = Math.random().toString(36).substring(2, 8).toUpperCase();
                                    await setDoc(voterRef, {
                                        name: name,
                                        token: randomToken,
                                        hasVoted: false
                                    });
                                    count++;
                                }
                            } catch (err) {}
                        }
                    }
                }
                fileInput.value = '';
                logActivity('Impor CSV', `Admin mengimpor ${count} data pemilih via CSV.`);
                showToast(`Berhasil mengimpor ${count} pemilih baru!`, 'success');
            };
            reader.readAsText(file);
        };

        window.enhanceTextAI = async (field, docId) => {
            const inputEl = document.getElementById(`edit-${field}-${docId}`);
            if (!inputEl || !inputEl.value.trim()) return showToast('Isi teks terlebih dahulu sebelum ditingkatkan AI.', 'warning');

            showToast('Memperbaiki teks dengan AI...', 'info');
            try {
                const systemPrompt = "Anda adalah asisten editor teks profesional untuk organisasi sekolah. Tugas Anda adalah merapikan, menyempurnakan tata bahasa, dan membuat teks visi/misi/proker pemilihan OSIS ini menjadi lebih profesional, visioner, dan terstruktur dengan tetap mempertahankan makna aslinya. Berikan hasil akhirnya saja tanpa penjelasan tambahan.";
                const userQuery = `Perbaiki teks ${field} berikut: ${inputEl.value}`;
                
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`;
                const payload = {
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                const enhanced = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (enhanced) {
                    inputEl.value = enhanced.trim();
                    showToast('Teks berhasil disempurnakan oleh AI!', 'success');
                } else {
                    showToast('Gagal memproses AI', 'error');
                }
            } catch (err) {
                showToast('Terjadi kesalahan koneksi AI', 'error');
            }
        };

                return `

                        </div>
                        <div class="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
                            <div class="bg-blue-600 h-full rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.togglePublish = async () => {
            const toggle = document.getElementById('publish-toggle');
            if (!toggle) return;
            try {
                await setDoc(doc(db, publicDataPath, 'config', 'settings'), {
                    resultsPublished: toggle.checked
                }, { merge: true });
                logActivity('Publikasi Hasil', `Status publikasi hasil diubah menjadi: ${toggle.checked}`);
                showToast(toggle.checked ? 'Hasil berhasil dipublikasikan!' : 'Publikasi hasil ditutup.', 'success');
            } catch (e) {
                showToast('Gagal memperbarui status publikasi', 'error');
            }
        };

        window.toggleBlankVote = async () => {
            const toggle = document.getElementById('blank-toggle');
            if (!toggle) return;
            try {
                await setDoc(doc(db, publicDataPath, 'config', 'settings'), {
                    allowBlankVote: toggle.checked
                }, { merge: true });
                showToast('Pengaturan suara kosong diperbarui', 'success');
            } catch (e) {
                showToast('Gagal memperbarui pengaturan', 'error');
            }
        };

        window.saveSchedule = async () => {
            const startEl = document.getElementById('sched-start');
            const endEl = document.getElementById('sched-end');
            if (!startEl || !endEl) return;
            
            try {
                await setDoc(doc(db, publicDataPath, 'config', 'settings'), {
                    startTime: startEl.value,
                    endTime: endEl.value
                }, { merge: true });
                logActivity('Jadwal Pemilu', `Jadwal pemilu diperbarui.`);
                showToast('Jadwal pemilihan otomatis berhasil disimpan!', 'success');
            } catch (e) {
                showToast('Gagal menyimpan jadwal', 'error');
            }
        };

        window.openReportModal = async () => {
            let totalVoted = votersData.filter(v => v.hasVoted).length;
            let totalVoters = votersData.length;
            let turnout = totalVoters > 0 ? ((totalVoted / totalVoters) * 100).toFixed(1) : 0;

            const repTotalVoters = document.getElementById('rep-total-voters');
            const repTotalVoted = document.getElementById('rep-total-voted');
            const repTurnout = document.getElementById('rep-turnout');
            
            if (repTotalVoters) repTotalVoters.innerText = totalVoters;
            if (repTotalVoted) repTotalVoted.innerText = totalVoted;
            if (repTurnout) repTurnout.innerText = turnout + '%';

            let totalVotes = candidatesData.reduce((acc, c) => acc + (c.votes || 0), 0);
            const listEl = document.getElementById('report-candidates-list');
            if (listEl) {
                listEl.innerHTML = candidatesData.map(cand => {
                    const votes = cand.votes || 0;
                    const pct = totalVotes > 0 ? ((votes / totalVotes) * 100).toFixed(1) : 0;
                    return `
                        <div class="flex justify-between items-center p-3 bg-slate-50 border border-slate-200 rounded-lg">
                            <span><strong>Paslon 0${cand.id}:</strong> ${escapeHTML(cand.name)}</span>
                            <span><strong>${votes} suara</strong> (${pct}%)</span>
                        </div>
                    `;
                }).join('');
            }

            openModal('report-modal');
        };

        function renderAdminAuditLogsTable() {
            const tbody = document.getElementById('admin-logs-list');
            if (!tbody) return;

            if (auditLogsData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center p-4 text-slate-400">Belum ada aktivitas tercatat.</td></tr>';
                return;
            }

            tbody.innerHTML = auditLogsData.map(log => {
                const dateStr = new Date(log.timestamp).toLocaleString('id-ID');
                return `
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="p-3 font-mono text-xs text-slate-500 whitespace-nowrap">${escapeHTML(dateStr)}</td>
                        <td class="p-3 font-semibold text-blue-600 whitespace-nowrap">${escapeHTML(log.action)}</td>
                        <td class="p-3 text-slate-700">${escapeHTML(log.details)}</td>
                    </tr>
                `;
            }).join('');
        }

        window.saveAppearanceSettings = async () => {
            const titleEl = document.getElementById('setting-title');
            const subtitleEl = document.getElementById('setting-subtitle');
            const logoFileEl = document.getElementById('setting-logo-file');
            const heroFileEl = document.getElementById('setting-hero-file');

            showToast('Menyimpan pengaturan...', 'info');
            try {
                let logoUrl = configData.logoUrl;
                let heroImage = configData.heroImage;

                if (logoFileEl && logoFileEl.files[0]) {
                    logoUrl = await fileToBase64(logoFileEl.files[0]);
                }
                if (heroFileEl && heroFileEl.files[0]) {
                    heroImage = await fileToBase64(heroFileEl.files[0]);
                }

                await setDoc(doc(db, publicDataPath, 'config', 'settings'), {
                    appTitle: titleEl ? titleEl.value.trim() : configData.appTitle,
                    appSubtitle: subtitleEl ? subtitleEl.value.trim() : configData.appSubtitle,
                    logoUrl: logoUrl,
                    heroImage: heroImage
                }, { merge: true });

                logActivity('Tampilan Web', 'Admin memperbarui teks atau gambar tampilan website.');
                showToast('Pengaturan tampilan berhasil disimpan!', 'success');
            } catch (e) {
                showToast('Gagal menyimpan gambar/tampilan', 'error');
            }
        };

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function getStudentResultsHTML() {
            let totalVotes = candidatesData.reduce((acc, c) => acc + (c.votes || 0), 0);
            return `
                <div class="max-w-4xl mx-auto fade-in">
                    <div class="text-center mb-8">
                        <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full mb-3 shadow-sm">
                            <i class="fa-solid fa-chart-pie text-2xl"></i>
                        </div>
                        <h2 class="text-3xl font-bold text-slate-800">Hasil Resmi Pemilihan Ketua OSIS</h2>
                        <p class="text-slate-500 mt-1">Berikut adalah perolehan suara yang telah disahkan oleh panitia.</p>
                    </div>

                    <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-8 space-y-6">
                        ${candidatesData.map(cand => {
                            const votes = cand.votes || 0;
                            const pct = totalVotes > 0 ? ((votes / totalVotes) * 100).toFixed(1) : 0;
                            return `
                                <div class="space-y-2">
                                    <div class="flex justify-between items-center font-bold text-slate-800">
                                        <span>Paslon 0${cand.id} - ${escapeHTML(cand.name)}</span>
                                        <span class="text-blue-600">${votes} suara (${pct}%)</span>
                                    </div>
                                    <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden border border-slate-200 shadow-inner">
                                        <div class="bg-blue-600 h-full rounded-full transition-all duration-700" style="width: ${pct}%"></div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="text-center mt-8">
                        <button onclick="switchView('home')" class="px-6 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-medium rounded-xl transition shadow-sm">
                            Kembali ke Beranda
                        </button>
                    </div>
                </div>
            `;
        }

        window.renderStudentResultsData = () => {
            const currentViewEl = document.getElementById('current-view-name');
            const currentView = currentViewEl ? currentViewEl.value : 'home';
            if (currentView === 'student-results') {
                const container = document.getElementById('app-content');
                if (container) container.innerHTML = getStudentResultsHTML();
            }
        };

        window.logoutAdmin = () => {
            logActivity('Admin Logout', `Admin dengan peran ${adminRole} keluar.`);
            adminRole = null;
            switchView('home');
        };

        window.toggleAIChat = () => {
            const panel = document.getElementById('ai-chat-panel');
            if (!panel) return;
            if (panel.classList.contains('scale-0')) {
                panel.classList.remove('scale-0');
                panel.classList.add('scale-100');
            } else {
                panel.classList.remove('scale-100');
                panel.classList.add('scale-0');
            }
        };

        window.sendAIChat = async () => {
            const input = document.getElementById('chat-input');
            const messages = document.getElementById('chat-messages');
            if (!input || !messages) return;
            
            const query = input.value.trim();
            if (!query) return;

            messages.innerHTML += `
                <div class="bg-indigo-600 text-white p-3 rounded-xl rounded-tr-none shadow-sm max-w-[85%] ml-auto">
                    ${escapeHTML(query)}
                </div>
            `;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            let candidatesContext = candidatesData.map(c => `Paslon 0${c.id} (${c.name}): Visi: ${c.vision}. Misi: ${c.mission}. Proker: ${c.proker}`).join('\n');
            const systemPrompt = `Anda adalah Asisten AI pemilu OSIS yang netral dan membantu siswa. Berikut adalah data kandidat:\n${candidatesContext}\nJawablah pertanyaan pemilih dengan singkat, jelas, dan objektif.`;

            try {
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`;
                const payload = {
                    contents: [{ parts: [{ text: query }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                const reply = result.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf, saya sedang tidak dapat merespon.";

                messages.innerHTML += `
                    <div class="bg-white p-3 rounded-xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%] text-slate-700">
                        ${escapeHTML(reply)}
                    </div>
                `;
                messages.scrollTop = messages.scrollHeight;
            } catch (e) {
                messages.innerHTML += `
                    <div class="bg-white p-3 rounded-xl rounded-tl-none shadow-sm border border-slate-100 max-w-[85%] text-red-500">
                        Gagal terhubung ke AI.
                    </div>
                `;
            }
        };

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function showToast(message, type = 'info') {
            const existing = document.getElementById('toast-notification');
            if (existing) existing.remove();

            const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : type === 'warning' ? 'bg-amber-600' : 'bg-blue-600';
            const html = `
                <div id="toast-notification" class="fixed top-6 right-6 ${bg} text-white px-5 py-3 rounded-xl shadow-xl z-50 flex items-center gap-3 fade-in font-medium text-sm">
                    <span>${message}</span>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
            setTimeout(() => {
                const el = document.getElementById('toast-notification');
                if (el) el.remove();
            }, 3500);
        }

        function hideLoading() {
            const loader = document.getElementById('initial-loader');
            if (loader) loader.style.display = 'none';
        }

        window.onload = initApp;
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">
    <!-- Initial Loader -->
    <div id="initial-loader" class="fixed inset-0 bg-slate-900 flex flex-col items-center justify-center z-50 text-white">
        <div class="loader mb-4"></div>
        <p class="font-medium text-lg">Memuat E-Pilketos OSIS...</p>
    </div>

    <!-- Hidden view tracker -->
    <input type="hidden" id="current-view-name" value="home">

    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('home')">
                <div id="navbar-logo-container" class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-md overflow-hidden">
                    E
                </div>
                <span id="navbar-brand-text" class="font-bold text-lg text-slate-800 tracking-tight">E-Pilketos</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="switchView('home')" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition px-3 py-2 rounded-lg hover:bg-slate-50">Beranda</button>
                <button onclick="switchView('admin-login')" class="text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 transition px-4 py-2 rounded-lg shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-user-shield"></i> Panel Admin
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Content -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8" id="app-content">
        <!-- Rendered dynamically -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12">
        <div class="max-w-6xl mx-auto px-4 text-center text-sm text-slate-500">
            <p>&copy; 2026 E-Pilketos OSIS Digital. Dilindungi Undang-Undang Pemilu Sekolah.</p>
        </div>
    </footer>
</body>
</html>
